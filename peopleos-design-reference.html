<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PeopleOS — HR Management</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: 'Inter', sans-serif; background: #0a0f1e; color: #e2e8f0; }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1e2a45; border-radius: 2px; }

  /* Tweaks panel */
  #tweaks-panel {
    display: none;
    position: fixed;
    bottom: 24px; right: 24px;
    background: #141b2d;
    border: 1px solid #1e2a45;
    border-radius: 16px;
    padding: 20px;
    width: 260px;
    z-index: 9999;
    box-shadow: 0 24px 64px rgba(0,0,0,0.6);
  }
  #tweaks-panel.visible { display: block; }
  #tweaks-panel h4 { font-size: 13px; font-weight: 600; color: #94a3b8; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 14px; }
  .tweak-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .tweak-label { font-size: 13px; color: #cbd5e1; }
  .tweak-toggle { position: relative; width: 36px; height: 20px; }
  .tweak-toggle input { opacity: 0; width: 0; height: 0; }
  .tweak-slider-track {
    position: absolute; inset: 0; background: #1e2a45; border-radius: 20px; cursor: pointer; transition: background .2s;
  }
  .tweak-toggle input:checked + .tweak-slider-track { background: #7c3aed; }
  .tweak-slider-track::after {
    content: ''; position: absolute; left: 3px; top: 3px;
    width: 14px; height: 14px; background: white; border-radius: 50%; transition: transform .2s;
  }
  .tweak-toggle input:checked + .tweak-slider-track::after { transform: translateX(16px); }
  .tweak-select {
    background: #0f172a; border: 1px solid #1e2a45; color: #e2e8f0;
    border-radius: 8px; padding: 4px 8px; font-size: 12px; cursor: pointer;
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="tweaks-panel">
  <h4>Tweaks</h4>
  <div class="tweak-row">
    <span class="tweak-label">Compact sidebar</span>
    <label class="tweak-toggle"><input type="checkbox" id="tw-compact"/><span class="tweak-slider-track"></span></label>
  </div>
  <div class="tweak-row">
    <span class="tweak-label">Glassmorphism cards</span>
    <label class="tweak-toggle"><input type="checkbox" id="tw-glass" checked/><span class="tweak-slider-track"></span></label>
  </div>
  <div class="tweak-row">
    <span class="tweak-label">Accent color</span>
    <select class="tweak-select" id="tw-accent">
      <option value="violet">Violet</option>
      <option value="cyan">Cyan</option>
      <option value="rose">Rose</option>
    </select>
  </div>
  <div class="tweak-row">
    <span class="tweak-label">Chart style</span>
    <select class="tweak-select" id="tw-chart">
      <option value="gradient">Gradient</option>
      <option value="solid">Solid</option>
    </select>
  </div>
</div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ─── ICONS (inline SVG) ─── */
const Icon = ({ d, size = 18, color = "currentColor", viewBox = "0 0 24 24" }) => (
  <svg width={size} height={size} viewBox={viewBox} fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
    {Array.isArray(d) ? d.map((p,i) => <path key={i} d={p}/>) : <path d={d}/>}
  </svg>
);

const Icons = {
  dashboard: ["M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z","M9 22V12h6v10"],
  employees: ["M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2","M23 21v-2a4 4 0 0 0-3-3.87","M16 3.13a4 4 0 0 1 0 7.75","M9 7a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"],
  payroll: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm.31 14.5v1.06h-1.5v-1.09c-1.25-.28-2.3-1.05-2.37-2.44h1.46c.07.72.58 1.27 1.82 1.27 1.32 0 1.61-.66 1.61-1.07 0-.56-.29-1.1-1.82-1.5-1.71-.45-2.88-1.22-2.88-2.62 0-1.22.97-2.02 2.18-2.3V7.5h1.5v1.05c1.36.33 2.04 1.29 2.07 2.44h-1.46c-.03-.77-.45-1.31-1.61-1.31-1.1 0-1.76.5-1.76 1.19 0 .6.47 1 1.82 1.39 1.36.4 2.88 1.06 2.88 2.74-.01 1.29-.97 2.11-2.44 2.5z",
  leave: ["M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z","M16 2v4","M8 2v4","M3 10h18"],
  attendance: ["M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z","M12 6v6l4 2"],
  performance: ["M18 20V10","M12 20V4","M6 20v-6"],
  benefits: ["M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"],
  settings: ["M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z","M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"],
  search: ["M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z","M21 21l-4.35-4.35"],
  bell: ["M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9","M13.73 21a2 2 0 0 1-3.46 0"],
  chevronUp: "M18 15l-6-6-6 6",
  chevronDown: "M6 9l6 6 6-6",
  check: "M20 6L9 17l-5-5",
  x: ["M18 6L6 18","M6 6l12 12"],
  trending: "M23 6l-9.5 9.5-5-5L1 18",
  people: ["M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2","M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"],
};

/* ─── COLOR SYSTEM ─── */
const C = {
  bg: '#0a0f1e',
  surface: '#0f172a',
  card: '#141b2d',
  cardHover: '#1a2338',
  border: '#1e2a45',
  borderLight: '#243050',
  violet: '#7c3aed',
  violetLight: '#a855f7',
  violetMuted: 'rgba(124,58,237,0.15)',
  cyan: '#06b6d4',
  cyanMuted: 'rgba(6,182,212,0.15)',
  amber: '#f59e0b',
  amberMuted: 'rgba(245,158,11,0.15)',
  green: '#10b981',
  greenMuted: 'rgba(16,185,129,0.15)',
  red: '#ef4444',
  redMuted: 'rgba(239,68,68,0.15)',
  text: '#e2e8f0',
  textMuted: '#64748b',
  textSub: '#94a3b8',
};

/* ─── DONUT CHART ─── */
function DonutChart({ data }) {
  const size = 180, cx = 90, cy = 90, r = 64, stroke = 20;
  const circumference = 2 * Math.PI * r;
  let offset = 0;
  const slices = data.map(d => {
    const dash = (d.pct / 100) * circumference;
    const gap = circumference - dash;
    const startOffset = circumference - offset * circumference / 100;
    offset += d.pct;
    return { ...d, dash, gap, startOffset };
  });
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 24 }}>
      <div style={{ position: 'relative', flexShrink: 0 }}>
        <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
          {slices.map((s, i) => (
            <circle key={i} cx={cx} cy={cy} r={r} fill="none"
              stroke={s.color} strokeWidth={stroke}
              strokeDasharray={`${s.dash} ${s.gap}`}
              strokeDashoffset={-s.startOffset + circumference}
              style={{ transition: 'all .4s ease' }}/>
          ))}
        </svg>
        <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
          <div style={{ fontSize: 22, fontWeight: 700, color: C.text }}>248</div>
          <div style={{ fontSize: 11, color: C.textMuted }}>Total</div>
        </div>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10, flex: 1 }}>
        {data.map((d, i) => (
          <div key={i} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <div style={{ width: 8, height: 8, borderRadius: '50%', background: d.color, flexShrink: 0 }}/>
              <span style={{ fontSize: 12, color: C.textSub }}>{d.name}</span>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <div style={{ width: 60, height: 4, background: C.border, borderRadius: 2, overflow: 'hidden' }}>
                <div style={{ width: `${d.pct}%`, height: '100%', background: d.color, borderRadius: 2 }}/>
              </div>
              <span style={{ fontSize: 12, fontWeight: 600, color: C.text, minWidth: 28, textAlign: 'right' }}>{d.pct}%</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ─── BAR CHART ─── */
function BarChart({ data, useGradient }) {
  const max = Math.max(...data.map(d => d.value));
  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
      <div style={{ display: 'flex', alignItems: 'flex-end', gap: 10, flex: 1, paddingBottom: 8 }}>
        {data.map((d, i) => {
          const pct = (d.value / max) * 100;
          const grad = useGradient
            ? 'linear-gradient(180deg, #a855f7 0%, #06b6d4 100%)'
            : '#7c3aed';
          return (
            <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, height: '100%', justifyContent: 'flex-end' }}>
              <span style={{ fontSize: 11, fontWeight: 600, color: C.textSub }}>{d.value}</span>
              <div style={{ width: '100%', height: `${pct}%`, background: grad, borderRadius: '4px 4px 0 0', minHeight: 4, transition: 'height .4s ease', position: 'relative', overflow: 'hidden' }}>
                <div style={{ position: 'absolute', inset: 0, background: 'rgba(255,255,255,0.06)' }}/>
              </div>
            </div>
          );
        })}
      </div>
      <div style={{ display: 'flex', gap: 10 }}>
        {data.map((d, i) => (
          <div key={i} style={{ flex: 1, textAlign: 'center', fontSize: 11, color: C.textMuted }}>{d.month}</div>
        ))}
      </div>
    </div>
  );
}

/* ─── STAT CARD ─── */
function StatCard({ title, value, sub, subColor, icon, iconBg, glass }) {
  const [hovered, setHovered] = useState(false);
  return (
    <div
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      style={{
        flex: 1,
        minWidth: 0,
        background: glass
          ? 'rgba(20,27,45,0.7)'
          : C.card,
        backdropFilter: glass ? 'blur(20px)' : 'none',
        WebkitBackdropFilter: glass ? 'blur(20px)' : 'none',
        border: `1px solid ${hovered ? C.borderLight : C.border}`,
        borderRadius: 16,
        padding: '20px 24px',
        cursor: 'default',
        transition: 'border-color .2s, transform .2s, box-shadow .2s',
        transform: hovered ? 'translateY(-2px)' : 'none',
        boxShadow: hovered ? '0 12px 40px rgba(0,0,0,0.4)' : 'none',
      }}
    >
      <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: 16 }}>
        <div style={{ fontSize: 13, color: C.textMuted, fontWeight: 500 }}>{title}</div>
        <div style={{ width: 36, height: 36, borderRadius: 10, background: iconBg, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          {icon}
        </div>
      </div>
      <div style={{ fontSize: 28, fontWeight: 700, color: C.text, letterSpacing: '-0.02em', lineHeight: 1 }}>{value}</div>
      <div style={{ marginTop: 8, fontSize: 12, color: subColor || C.textMuted }}>{sub}</div>
    </div>
  );
}

/* ─── STATUS BADGE ─── */
function Badge({ status }) {
  const map = {
    Active:    { bg: 'rgba(16,185,129,0.15)', color: '#10b981' },
    Probation: { bg: 'rgba(245,158,11,0.15)',  color: '#f59e0b' },
    Remote:    { bg: 'rgba(6,182,212,0.15)',   color: '#06b6d4' },
  };
  const s = map[status] || map.Active;
  return (
    <span style={{ background: s.bg, color: s.color, fontSize: 11, fontWeight: 600, padding: '3px 10px', borderRadius: 20, letterSpacing: '0.03em' }}>
      {status}
    </span>
  );
}

/* ─── AVATAR ─── */
function Avatar({ name, size = 32, color }) {
  const initials = name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
  const colors = ['#7c3aed','#06b6d4','#10b981','#f59e0b','#ef4444','#8b5cf6'];
  const bg = color || colors[name.charCodeAt(0) % colors.length];
  return (
    <div style={{ width: size, height: size, borderRadius: '50%', background: bg, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: size * 0.36, fontWeight: 700, color: 'white', flexShrink: 0, letterSpacing: '0.02em' }}>
      {initials}
    </div>
  );
}

/* ─── SIDEBAR ─── */
const navItems = [
  { key: 'dashboard',   label: 'Dashboard',        icon: Icons.dashboard },
  { key: 'employees',   label: 'Employees',         icon: Icons.employees },
  { key: 'payroll',     label: 'Payroll',           icon: Icons.payroll },
  { key: 'leave',       label: 'Leave Management',  icon: Icons.leave },
  { key: 'attendance',  label: 'Attendance',        icon: Icons.attendance },
  { key: 'performance', label: 'Performance',       icon: Icons.performance },
  { key: 'benefits',    label: 'Benefits',          icon: Icons.benefits },
  { key: 'settings',    label: 'Settings',          icon: Icons.settings },
];

function Sidebar({ active, onNav, compact }) {
  return (
    <aside style={{
      width: compact ? 68 : 240,
      flexShrink: 0,
      background: C.bg,
      borderRight: `1px solid ${C.border}`,
      display: 'flex',
      flexDirection: 'column',
      height: '100vh',
      transition: 'width .25s cubic-bezier(.4,0,.2,1)',
      overflow: 'hidden',
    }}>
      {/* Logo */}
      <div style={{ padding: compact ? '24px 0' : '24px 20px', display: 'flex', alignItems: 'center', gap: 10, borderBottom: `1px solid ${C.border}`, justifyContent: compact ? 'center' : 'flex-start' }}>
        <div style={{ width: 34, height: 34, borderRadius: 10, background: 'linear-gradient(135deg,#7c3aed,#06b6d4)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        {!compact && (
          <div>
            <div style={{ fontSize: 15, fontWeight: 800, color: C.text, letterSpacing: '-0.02em', lineHeight: 1.1 }}>PeopleOS</div>
            <div style={{ fontSize: 10, color: C.textMuted, letterSpacing: '0.05em', marginTop: 1 }}>HR PLATFORM</div>
          </div>
        )}
      </div>

      {/* Nav */}
      <nav style={{ flex: 1, padding: '12px 10px', display: 'flex', flexDirection: 'column', gap: 2, overflowY: 'auto' }}>
        {navItems.map(item => {
          const isActive = active === item.key;
          return (
            <button key={item.key} onClick={() => onNav(item.key)}
              title={compact ? item.label : ''}
              style={{
                display: 'flex', alignItems: 'center', gap: 12,
                padding: compact ? '10px 0' : '10px 14px',
                justifyContent: compact ? 'center' : 'flex-start',
                borderRadius: 10, border: 'none', cursor: 'pointer',
                background: isActive ? C.violetMuted : 'transparent',
                color: isActive ? C.violetLight : C.textMuted,
                fontFamily: 'Inter, sans-serif',
                fontSize: 13, fontWeight: isActive ? 600 : 400,
                width: '100%', transition: 'all .15s',
              }}
              onMouseEnter={e => { if (!isActive) { e.currentTarget.style.background = 'rgba(30,42,69,0.7)'; e.currentTarget.style.color = C.textSub; } }}
              onMouseLeave={e => { if (!isActive) { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = C.textMuted; } }}
            >
              {isActive && !compact && <div style={{ position: 'absolute', left: 10, width: 3, height: 20, background: C.violet, borderRadius: 2 }}/>}
              <Icon d={item.icon} size={17} color="currentColor"/>
              {!compact && <span style={{ whiteSpace: 'nowrap' }}>{item.label}</span>}
            </button>
          );
        })}
      </nav>

      {/* Admin */}
      <div style={{ padding: compact ? '16px 0' : '16px 14px', borderTop: `1px solid ${C.border}`, display: 'flex', alignItems: 'center', gap: 10, justifyContent: compact ? 'center' : 'flex-start' }}>
        <Avatar name="Aravinth K" size={34} color="#7c3aed"/>
        {!compact && (
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: C.text, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>Aravinth K</div>
            <div style={{ fontSize: 11, color: C.textMuted }}>HR Admin</div>
          </div>
        )}
      </div>
    </aside>
  );
}

/* ─── TOP NAVBAR ─── */
function Navbar({ page }) {
  const [search, setSearch] = useState('');
  return (
    <header style={{
      height: 64, background: C.surface, borderBottom: `1px solid ${C.border}`,
      display: 'flex', alignItems: 'center', padding: '0 28px', gap: 20, flexShrink: 0,
    }}>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 18, fontWeight: 700, color: C.text, letterSpacing: '-0.02em' }}>{page}</div>
        <div style={{ fontSize: 12, color: C.textMuted }}>Wednesday, April 23, 2026</div>
      </div>
      {/* Search */}
      <div style={{ position: 'relative' }}>
        <div style={{ position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)', color: C.textMuted }}>
          <Icon d={Icons.search} size={14}/>
        </div>
        <input value={search} onChange={e => setSearch(e.target.value)}
          placeholder="Search employees, docs…"
          style={{
            background: C.card, border: `1px solid ${C.border}`, borderRadius: 10,
            padding: '8px 16px 8px 36px', color: C.text, fontSize: 13,
            outline: 'none', width: 220, fontFamily: 'Inter, sans-serif',
            transition: 'border-color .15s',
          }}
          onFocus={e => e.target.style.borderColor = C.violet}
          onBlur={e => e.target.style.borderColor = C.border}
        />
      </div>
      {/* Bell */}
      <div style={{ position: 'relative', cursor: 'pointer' }}>
        <div style={{ width: 38, height: 38, borderRadius: 10, background: C.card, border: `1px solid ${C.border}`, display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.textSub }}>
          <Icon d={Icons.bell} size={16}/>
        </div>
        <div style={{ position: 'absolute', top: 6, right: 6, width: 8, height: 8, borderRadius: '50%', background: C.amber, border: `2px solid ${C.surface}` }}/>
      </div>
      {/* Avatar */}
      <Avatar name="Aravinth K" size={36} color="#7c3aed"/>
    </header>
  );
}

/* ─── LEAVE REQUEST ROW ─── */
function LeaveRow({ req, onApprove, onReject }) {
  const [status, setStatus] = useState('pending');
  const handleApprove = () => { setStatus('approved'); onApprove && onApprove(); };
  const handleReject  = () => { setStatus('rejected');  onReject  && onReject();  };

  const typeColor = {
    Annual: C.cyan,
    Sick: C.red,
    Personal: C.amber,
    Maternity: C.violetLight,
  }[req.type] || C.textSub;

  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '11px 0', borderBottom: `1px solid ${C.border}` }}>
      <Avatar name={req.name} size={32}/>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: C.text, marginBottom: 2 }}>{req.name}</div>

      <span style={{ background: `${typeColor}22`, color: typeColor, fontSize: 11, fontWeight: 600, padding: '2px 8px', borderRadius: 6 }}>{req.type}</span>
      {status === 'pending' ? (
        <div style={{ display: 'flex', gap: 6 }}>
          <button onClick={handleApprove} style={{ background: C.greenMuted, color: C.green, border: `1px solid rgba(16,185,129,0.3)`, borderRadius: 7, padding: '5px 10px', fontSize: 11, fontWeight: 600, cursor: 'pointer', fontFamily: 'Inter', transition: 'all .15s' }}
            onMouseEnter={e => e.currentTarget.style.background = 'rgba(16,185,129,0.25)'}
            onMouseLeave={e => e.currentTarget.style.background = C.greenMuted}>
            Approve
          </button>
          <button onClick={handleReject} style={{ background: C.redMuted, color: C.red, border: `1px solid rgba(239,68,68,0.3)`, borderRadius: 7, padding: '5px 10px', fontSize: 11, fontWeight: 600, cursor: 'pointer', fontFamily: 'Inter', transition: 'all .15s' }}
            onMouseEnter={e => e.currentTarget.style.background = 'rgba(239,68,68,0.25)'}
            onMouseLeave={e => e.currentTarget.style.background = C.redMuted}>
            Reject
          </button>
        </div>
      ) : (
        <span style={{ fontSize: 12, fontWeight: 600, color: status === 'approved' ? C.green : C.red, padding: '4px 10px', background: status === 'approved' ? C.greenMuted : C.redMuted, borderRadius: 7 }}>
          {status === 'approved' ? '✓ Approved' : '✕ Rejected'}
        </span>
      )}
    </div>
  );
}

      {/* Add Employee Modal */}
      {showModal && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.7)', backdropFilter: 'blur(4px)', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'center' }}
          onClick={() => setShowModal(false)}>
          <div onClick={e => e.stopPropagation()}
            style={{ background: '#141b2d', border: `1px solid ${C.borderLight}`, borderRadius: 20, padding: '32px', width: 480, boxShadow: '0 32px 80px rgba(0,0,0,0.7)' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 24 }}>
              <div style={{ fontSize: 17, fontWeight: 700, color: C.text }}>Add New Employee</div>
              <button onClick={() => setShowModal(false)} style={{ background: C.border, border: 'none', color: C.textSub, borderRadius: 8, width: 30, height: 30, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <Icon d={Icons.x} size={14}/>
              </button>
            </div>
            {[
              { label: 'Full Name',        placeholder: 'e.g. Sara Al Mansoori' },
              { label: 'Job Title',        placeholder: 'e.g. Senior Engineer' },
              { label: 'Email Address',    placeholder: 'name@peopleos.ae' },
              { label: 'Phone Number',     placeholder: '+971 50 000 0000' },
            ].map((f, i) => (
              <div key={i} style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: C.textSub, marginBottom: 6 }}>{f.label}</div>
                <input placeholder={f.placeholder}
                  style={{ width: '100%', background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: '10px 14px', fontSize: 13, color: C.text, fontFamily: 'Inter', outline: 'none' }}
                  onFocus={e => e.target.style.borderColor = C.violet}
                  onBlur={e => e.target.style.borderColor = C.border}
                />
              </div>
            ))}
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 24 }}>
              {[
                { label: 'Department', options: ['Engineering','Sales','HR','Finance','Operations'] },
                { label: 'Employment Type', options: ['Full-time','Part-time','Contract'] },
              ].map((f, i) => (
                <div key={i}>
                  <div style={{ fontSize: 12, fontWeight: 600, color: C.textSub, marginBottom: 6 }}>{f.label}</div>
                  <select style={{ width: '100%', background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: '10px 14px', fontSize: 13, color: C.textMuted, fontFamily: 'Inter', outline: 'none', appearance: 'none' }}>
                    <option value="">Select…</option>
                    {f.options.map(o => <option key={o}>{o}</option>)}
                  </select>
                </div>
              ))}
            </div>
            <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
              <button onClick={() => setShowModal(false)} style={{ background: C.border, color: C.textSub, border: 'none', borderRadius: 10, padding: '10px 20px', fontSize: 13, fontWeight: 600, cursor: 'pointer', fontFamily: 'Inter' }}>
                Cancel
              </button>
              <button onClick={() => setShowModal(false)} style={{ background: 'linear-gradient(135deg,#7c3aed,#6d28d9)', color: 'white', border: 'none', borderRadius: 10, padding: '10px 24px', fontSize: 13, fontWeight: 600, cursor: 'pointer', fontFamily: 'Inter', boxShadow: '0 4px 16px rgba(124,58,237,0.4)' }}>
                Add Employee
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ─── PLACEHOLDER PAGE ─── */
function PlaceholderPage({ name, icon }) {
  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 16, color: C.textMuted }}>
      <div style={{ width: 64, height: 64, borderRadius: 18, background: C.card, border: `1px solid ${C.border}`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <Icon d={icon} size={26} color={C.textMuted}/>
      </div>
      <div style={{ fontSize: 16, fontWeight: 600, color: C.textSub }}>{name}</div>
      <div style={{ fontSize: 13, color: C.textMuted }}>This section is coming soon</div>
    </div>
  );
}

/* ─── APP ROOT ─── */
function App() {
  const [activePage, setActivePage] = useState('dashboard');
  const [compact, setCompact]       = useState(false);
  const [glass, setGlass]           = useState(true);
  const [gradient, setGradient]     = useState(true);
  const [accentKey, setAccentKey]   = useState('violet');

  // Tweaks wiring
  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode')   { document.getElementById('tweaks-panel').classList.add('visible'); }
      if (e.data?.type === '__deactivate_edit_mode') { document.getElementById('tweaks-panel').classList.remove('visible'); }
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');

    const compactEl = document.getElementById('tw-compact');
    const glassEl   = document.getElementById('tw-glass');
    const accentEl  = document.getElementById('tw-accent');
    const chartEl   = document.getElementById('tw-chart');

    const sync = () => {
      setCompact(compactEl.checked);
      setGlass(glassEl.checked);
      setAccentKey(accentEl.value);
      setGradient(chartEl.value === 'gradient');
    };
    compactEl.addEventListener('change', sync);
    glassEl.addEventListener('change', sync);
    accentEl.addEventListener('change', sync);
    chartEl.addEventListener('change', sync);

    return () => window.removeEventListener('message', handler);
  }, []);

  const pageLabel = navItems.find(n => n.key === activePage)?.label || 'Dashboard';
  const pageIcon  = navItems.find(n => n.key === activePage)?.icon;

  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden', background: C.bg }}>
      <Sidebar active={activePage} onNav={setActivePage} compact={compact}/>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0, background: C.surface }}>
        <Navbar page={pageLabel}/>
        {activePage === 'dashboard'
          ? <Dashboard glass={glass} useGradient={gradient}/>
          : activePage === 'employees'
          ? <EmployeesPage glass={glass}/>
          : <PlaceholderPage name={pageLabel} icon={pageIcon}/>
        }
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
